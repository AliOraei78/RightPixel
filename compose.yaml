name: rightpixel

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: rightpixel
      POSTGRES_USER: rightpixel_migrator
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?required}"
      RIGHTPIXEL_DB_PASSWORD: "${POSTGRES_PASSWORD:?required}"
    volumes:
      - rightpixel-postgres:/var/lib/postgresql
      - ./tools/postgres-init.sh:/docker-entrypoint-initdb.d/10-rightpixel.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rightpixel_migrator -d rightpixel"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__Game: "Host=db;Database=rightpixel;Username=rightpixel_migrator;Password=${POSTGRES_ADMIN_PASSWORD:?required}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${RIGHTPIXEL_ENVIRONMENT:-Production}"
      Database__InitializeOnStartup: "false"
      Content__InstallBundledCourse: "${RIGHTPIXEL_INSTALL_CSHARP:-true}"
      ConnectionStrings__Game: "Host=db;Database=rightpixel;Username=rightpixel;Password=${POSTGRES_PASSWORD:?required}"
      Auth__CodeKey: "${AUTH_CODE_KEY:?required}"
      EmailSettings__Host: "${SMTP_HOST}"
      EmailSettings__Port: "${SMTP_PORT:-587}"
      EmailSettings__UserName: "${SMTP_USERNAME}"
      EmailSettings__Password: "${SMTP_PASSWORD}"
      EmailSettings__FromEmail: "${SMTP_FROM_EMAIL}"
      EmailSettings__FromName: "${SMTP_FROM_NAME}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - rightpixel-keys:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

  web:
    networks:
      default:
        ipv4_address: 192.168.240.10
    build:
      context: ./src/rightpixel-web
    ports:
      - "127.0.0.1:${RIGHTPIXEL_PORT:-8085}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  rightpixel-data:
  rightpixel-postgres:
  rightpixel-keys:

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.240.0/24
